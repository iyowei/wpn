# 网关专用的子域名反向代理实例 (rwpn 实际配置)
# 通用 nginx 配置 (proxy.conf、security.conf、general_route.conf、letsencrypt.conf) 来自 nginx-forge 项目
# 上游 10.8.0.3:8088 是 WireGuard 内网的端节点

upstream rrpi_fdm {
  server 10.8.0.3:8088;
  keepalive 16;
}

server {
  listen 443 quic;
  listen [::]:443 quic;

  listen 443 ssl;
  listen [::]:443 ssl;

  http3 on;
  http2 on;

  server_name fdm.qipao.world;

  # HTTP/3相关头部
  add_header Alt-Svc 'h3=":443"; ma=86400' always;

  # 根路径重定向到 /bridge/
  location = / {
    return 302 /bridge/;
  }

  # 补齐尾部斜杠，确保浏览器相对路径寻址锚定在 /bridge/ 目录级别
  location = /bridge {
    return 301 /bridge/;
  }

  # 1. 静态哈希资产（带版本指纹）：1年强缓存，二次访问 0ms 本地瞬开
  location ^~ /bridge/assets/ {
    proxy_pass http://rrpi_fdm/assets/;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    include /usr/local/nginx/conf/proxy.conf;
    include /usr/local/nginx/conf/security.conf;
  }

  # 2. 静态论文配图与公式图片（根路径透传，开启 1 年强缓存）
  location ^~ /paper_images/ {
    proxy_pass http://rrpi_fdm/paper_images/;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    include /usr/local/nginx/conf/proxy.conf;
    include /usr/local/nginx/conf/security.conf;
  }

  # 3. 静态论文配图与公式图片（子路径兜底透传，开启 1 年强缓存）
  location ^~ /bridge/paper_images/ {
    proxy_pass http://rrpi_fdm/paper_images/;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    include /usr/local/nginx/conf/proxy.conf;
    include /usr/local/nginx/conf/security.conf;
  }

  # 4. 页面入口与主路由：协商缓存（no-cache），保证代码更新后立即拉取最新 HTML
  location ^~ /bridge/ {
    proxy_pass http://rrpi_fdm/;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;

    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    include /usr/local/nginx/conf/proxy.conf;
    include /usr/local/nginx/conf/security.conf;
  }

  # SSL 证书
  ssl_certificate /etc/letsencrypt/live/fdm.qipao.world/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/fdm.qipao.world/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/fdm.qipao.world/chain.pem;

  # security
  include /usr/local/nginx/conf/security.conf;

  # additional config
  include /usr/local/nginx/conf/general_route.conf;

  # logging
  access_log logs/fdm.qipao.world.access.log;
  error_log logs/fdm.qipao.world.error.log warn;
}

# HTTP redirect & Let's Encrypt ACME challenge
server {
  listen 80;
  listen [::]:80;

  server_name fdm.qipao.world;

  include /usr/local/nginx/conf/letsencrypt.conf;

  location / {
    return 301 https://$host$request_uri;
  }

  # 安全头部
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
}
